# Design parameters. Mirrors docs/protocol.md; change both together.
backend: mock
# Any of: mock | openai:<model-id> | anthropic:<model-id>
#         grok:<model-id> | gemini:<model-id>
# Paper 9.5 wants at least two distinct families. Results are reported per
# family and never pooled.
cross_family_backends: []
cache_dir: null               # e.g. .cache/run7; makes reruns and re-analysis free
# judge: see experiments/configs/judge.json (model REQUIRED for live runs)
audit_fraction: 0.20          # E1 human-audit sample (e1_audit.jsonl)
scenes_per_cell: 40
turns_per_scene: 24
facts_per_seat: 3
probe_turns: [4, 8, 16, 24]
temperature: 1.0
temperature_sweep: [0.3, 0.7, 1.0]   # L1 only

levels: [0, 1, 2, 3, 4]

reference_conditions:
  floor: {level: 0, shared_window: true}
  ceiling: {separate_processes: true, shared_history: false,
            implementation: seatkit.ceiling.SeparatedBench,
            per_seat_cache: true}

gates:
  prior_verification_trials: 3
  fail_on_any_recovery: true

analysis:
  alpha: 0.05
  correction: benjamini_hochberg
  report_position_not_raw: true
  context_length_unit: prompt_words   # NOT prompt_tokens: tokenizers differ
                                      # between families and would confound
                                      # the wall effect with granularity
  report_uncorrected_alongside: true
  half_life_censoring: turns_plus_one     # restricted mean; report n_never_converged
  # P8 margin and P6-at-L1 choice: experiments/configs/prereg.json
  # Judge model, settings, thresholds: experiments/configs/judge.json
